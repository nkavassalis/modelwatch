[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwatch"
version = "0.1.0"
description = "RSS feed for newly trending Hugging Face models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "boto3>=1.34"]

[project.scripts]
modelwatch = "modelwatch.cli:main"

[tool.setuptools.packages.find]
include = ["modelwatch*"]
